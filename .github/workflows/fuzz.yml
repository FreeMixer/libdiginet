name: fuzz
# The libFuzzer harnesses of fuzz/ (fuzz/README.md), on every push and pull request: each built
# with clang under AddressSanitizer and UndefinedBehaviorSanitizer and fuzzed for 60 s from its
# seed corpus, every mutant of fuzz/mutants/ found by its own property, the coverage witness held
# to its floor, and the corpus what fuzz-corpus writes. An input that crashes a harness is
# uploaded as the fuzz-findings artifact. make test stays in ci.yml.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  fuzz:
    name: fuzz the frame, the command grammar, the codecs and the session
    runs-on: ubuntu-latest
    # A backstop: fuzz-run spends 60 s on each of four harnesses and fuzz-sabotage runs seeds only.
    timeout-minutes: 30
    container: fedora:44
    steps:
      - name: clang, libFuzzer and llvm-cov
        run: dnf -y install --setopt=install_weak_deps=False clang compiler-rt llvm gcc make gawk git diffutils
      - uses: actions/checkout@v4
      # fuzz-sabotage applies each mutant with git apply and restores it with git checkout
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the harnesses (clang, libFuzzer, ASan, UBSan)
        run: make fuzz
      - name: The seed corpus is what fuzz-corpus writes
        run: make fuzz-corpus-check
      - name: Fuzz each harness for 60 s
        run: make fuzz-run FUZZ_TIME=60
      # a property no mutant can break checks nothing: each one-line mutant must make its
      # harness abort on a seed, in that property's own check
      - name: Find every mutant, each by its own property
        run: make fuzz-sabotage
      # the seed corpus must keep reaching the lines it reaches today and every property check
      - name: Hold the coverage floor
        run: make fuzz-cov
      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz/findings/
          if-no-files-found: ignore
